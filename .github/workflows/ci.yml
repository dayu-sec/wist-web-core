name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 本包零构建（源码即产物），所以 CI 只做两件事：跑行为测试 + 校验手写的 .d.ts。
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (behavior)
        run: npm test

      - name: Test (types)
        run: npm run check-types
